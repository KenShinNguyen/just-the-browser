# This repository is a fork. Upstream keeps adding browser policies as new AI
# and telemetry features ship, and a fork that does not follow along quietly
# stops working: users think a feature is turned off when nothing turns it off.
# This checks weekly. Issues are disabled on this fork, so a drift is reported by
# failing the run and writing the details to the run summary, which is what
# GitHub notifies the repository owner about.

name: Upstream drift
on:
  schedule:
    # Mondays at 07:00 UTC
    - cron: '0 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: Compare policies with upstream
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout this fork
      uses: actions/checkout@v4

    - name: Checkout upstream
      run: |
        git clone --depth 1 \
          https://github.com/corbindavenport/just-the-browser upstream-checkout

    - name: Compare policies
      id: compare
      run: |
        set +e
        python3 scripts/check_upstream_drift.py upstream-checkout > drift-report.md
        echo "drift=$?" >> "$GITHUB_OUTPUT"
        cat drift-report.md

    # Issues are disabled on this fork, so the report goes to the run summary
    # and the job fails, which is what GitHub notifies the repository owner about
    - name: Publish the report
      run: cat drift-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: Fail when the fork has drifted
      if: steps.compare.outputs.drift == '1'
      run: |
        echo "::error::This fork's browser policies differ from upstream. See the job summary for what changed."
        exit 1
