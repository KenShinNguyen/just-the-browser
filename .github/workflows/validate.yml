# Action to check the browser configuration files, the install scripts, and the site build
# The configuration checks enforce the synchronization rules in CONTRIBUTING.md

name: Validate
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  configs:
    name: Browser configuration files
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check that every platform has the same settings
      run: python3 scripts/validate_configs.py

    - name: Check the helper scripts compile
      run: python3 -m compileall -q scripts/

  scripts:
    name: Install scripts
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Check main.sh with ShellCheck
      # SC2162 is not enabled, because the "press Enter to continue" prompts
      # throw their input away and do not need "read -r"
      run: shellcheck --severity=warning main.sh

    - name: Check main.sh parses
      run: bash -n main.sh

    - name: Check main.ps1 parses
      shell: pwsh
      run: |
        $parseErrors = $null
        [System.Management.Automation.Language.Parser]::ParseFile(
          "$PWD/main.ps1", [ref]$null, [ref]$parseErrors) | Out-Null
        if ($parseErrors) {
          $parseErrors | ForEach-Object {
            Write-Host "::error file=main.ps1,line=$($_.Extent.StartLineNumber)::$($_.Message)"
          }
          exit 1
        }
        Write-Host "main.ps1 parses cleanly"

    - name: Check main.ps1 with PSScriptAnalyzer
      shell: pwsh
      run: |
        Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
        $results = Invoke-ScriptAnalyzer -Path ./main.ps1 -Severity Error
        if ($results) {
          $results | Format-Table -AutoSize | Out-String | Write-Host
          exit 1
        }
        Write-Host "No PSScriptAnalyzer errors"

  site:
    name: Website build
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Build site
      run: npx @11ty/eleventy --input=. --output=_site
